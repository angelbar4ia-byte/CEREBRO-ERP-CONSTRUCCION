name: Verificar el cerebro

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar coherencia
        run: python3 2-operacion/verificar-cerebro.py .
      - name: Instalar lo que las pruebas del backend necesitan (base, API y navegador)
        run: |
          pip install -r backend/requirements.txt
          playwright install --with-deps chromium
      - name: Probar el motor, la persistencia, la API y la pantalla contra los programas reales
        run: cd backend && python3 -m unittest discover
      - name: Comprobar que el cliente de la pantalla es el que da el spec de la API
        run: cd backend && python3 -m api.generar_cliente --verificar
