name: Verificar el cerebro

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar coherencia
        run: python3 2-operacion/verificar-cerebro.py .
      - name: Instalar lo que las pruebas de persistencia necesitan
        run: pip install pgserver "psycopg[binary]"
      - name: Probar el motor y la persistencia contra los programas reales
        run: cd backend && python3 -m unittest discover
